# Gradle
#
# 内存：本机 16 GB，空闲时其他程序已吃掉约 8 GB。原来给 daemon 6g，加上 Kotlin daemon、
# AGP worker、D8 很容易把物理内存顶满 -> 换页。而页面文件是系统托管、落在 C 盘，
# C 盘长期只剩 ~19 GB，一换页就是磁盘抖动，表现出来就是"构建卡住但 java 进程还活着"。
# 4g 对本项目（shared + app 两个模块）足够。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# 本机 JDK 的固定不在这里 —— 它是**机器相关**的配置，一旦入库，别人 clone 下来
# 路径对不上就直接构建失败。请把它写进用户级 ~/.gradle/gradle.properties：
#
#     org.gradle.java.home=C:/Program Files/Java/<你的 jdk>
#
# 留空时 Gradle 会按 JAVA_HOME → toolchain 的顺序自己找，这正是 clone 者想要的行为。


# 配置缓存：Gradle 自己在 daemon 日志里建议了 65 次
# （"Consider enabling configuration cache to speed up this build"）。
# 开了以后 settings + 所有 build.gradle.kts + 插件/工具链解析只在依赖或脚本变化时重跑。
# 注意：改了 build.gradle.kts / libs.versions.toml 之后缓存会自动失效重算，属正常。
org.gradle.configuration-cache=true

# 文件系统监听，增量构建时能少扫一遍目录
org.gradle.vfs.watch=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Kotlin 编译跑在独立 daemon 里，单独限一下额度，别和 Gradle daemon 抢内存
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
