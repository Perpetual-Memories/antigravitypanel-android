[versions]
agp = "9.2.1"
kotlin = "2.4.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# KSP 从 2.3.0 起不再挂 Kotlin 版本号；2.3.10 明确修了 Kotlin 2.4.0 的兼容问题
ksp = "2.3.12"

# Compose Multiplatform：Miuix 0.9.4-rc01 依赖 1.12.0-rc01，统一取正式版 1.12.0
jetbrains-compose-multiplatform = "1.12.0"
jetbrains-compose-window-size = "1.9.0"
jetbrains-lifecycle = "2.10.0"

# 与 HyperIsland 同版本，方便直接照搬它的布局与模糊实现
miuix = "0.9.4-rc01"
vico = "3.3.1"

androidx-activity = "1.13.0"
# cookie 是账号凭证，落盘必须加密
androidx-security-crypto = "1.1.0"
androidx-navigation3 = "1.1.4"
androidx-navigationevent = "1.1.2"
# 扫码登录：PC 端出二维码、移动端扫。相机预览走 CameraX，解码走 ZXing（纯 Java，不碰 GMS）
androidx-camera = "1.6.2"
zxing = "3.5.4"

# P1 已接入 Ktor；Room 在 P2 落地，Coil 在 P4 接掉落物图标时落地
ktor = "3.5.2"
room = "2.8.5"
# Room 2.8.5 依赖 androidx.sqlite 2.6.2，取更高的稳定版 2.7.1
sqlite = "2.7.1"
# Coil 3.6.3 的 android 变体正好依赖 org.jetbrains.compose.foundation 1.12.0，
# 和本项目的 CMP 版本对得上（3.5.0 及更早还是 1.9/1.10 那一代）。
# 以后再升 Coil，先核它依赖的是哪版 compose foundation。
coil = "3.6.3"

junit = "1.3.0"

[libraries]
# ---- Miuix（模块必须同版本号）----
# 注意：miuix-navigation3-ui 只发到 0.9.3，且本项目走的是 androidx navigation3，
# 没用到它，所以不在这里声明。
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }

# ---- 图表 ----
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }

# ---- Compose ----
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrains-compose-multiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrains-compose-multiplatform" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetbrains-compose-multiplatform" }
jetbrains-compose-window-size = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "jetbrains-compose-window-size" }
# NavDisplay 的 AnimatedContent 系列 API（页面转场）在这个模块里，
# 以前靠传递依赖能用到，既然现在自己写了转场就显式声明
jetbrains-compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "jetbrains-compose-multiplatform" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }

# ---- AndroidX（全部走 google()）----
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
# NavDisplay 所在的模块。原先是搭 miuix-navigation3-ui 的车进来的，
# 那个模块只发到 0.9.3，所以改成直接依赖 androidx 的。
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-navigationevent = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }

androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }

androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }

# ---- 扫码（只有 android 目标，全部挂 androidMain）----
# camera-view 里有 PreviewView，camera-camera2 是 CameraX 1.x 唯一的相机实现
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
# 只解二维码，不用 ML Kit 是不想为个扫码把 GMS 传递依赖拖进来（国内设备没有 GMS）
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# ---- 本地数据库：Room（KMP 版，commonMain 直接用，驱动用 bundled）----
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# ---- 图片：Coil 3（commonMain 放 compose 集成，网络取图器放 androidMain）----
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# ---- 网络：Ktor（commonMain 只放 core/插件，引擎放 androidMain）----
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Room 的 DAO 返回 Flow / suspend，显式声明而不是靠传递依赖
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose-multiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
